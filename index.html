<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - BelanjaDulu</title>
    
    <!-- Memuat Font Poppins dari Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Memuat Tailwind CSS melalui CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Konfigurasi Tailwind untuk tema warna khusus -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#10b981', // Emerald 500 (Hijau Utama)
                        primaryDark: '#047857', // Emerald 700 (Hijau Tua)
                        primaryLight: '#34d399', // Emerald 400 (Hijau Muda)
                        error: '#ef4444' // Red 500
                    },
                    fontFamily: {
                        sans: ['Poppins', 'sans-serif']
                    },
                    animation: {
                        'slide-up': 'slideUp 0.5s ease-out',
                        'fade-in': 'fadeIn 0.3s ease-in-out',
                        'slide-down': 'slideDown 0.4s ease-out forwards'
                    },
                    keyframes: {
                        slideUp: {
                            '0%': { opacity: '0', transform: 'translateY(20px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' }
                        },
                        fadeIn: {
                            '0%': { opacity: '0' },
                            '100%': { opacity: '1' }
                        },
                        slideDown: {
                            '0%': { opacity: '0', transform: 'translateY(-50px) translateX(-50%)' },
                            '100%': { opacity: '1', transform: 'translateY(0) translateX(-50%)' }
                        }
                    }
                }
            }
        }
    </script>

    <style>
        /* Styling tambahan untuk hal yang spesifik */
        body {
            font-family: 'Poppins', sans-serif;
            /* Latar belakang gradient hijau halus */
            background: linear-gradient(135deg, #ecfdf5 0%, #d1fae5 100%);
            min-height: 100vh;
        }
        
        /* Menyembunyikan elemen secara visual namun tetap ada di DOM untuk animasi */
        .view-hidden {
            display: none;
        }
        
        .input-error {
            border-color: #ef4444 !important;
            box-shadow: 0 0 0 1px #ef4444 !important;
        }
    </style>
</head>
<body class="flex items-center justify-center p-4">

    <!-- Notifikasi Kustom (Pengganti Alert) -->
    <div id="notificationBox" class="fixed top-6 left-1/2 transform -translate-x-1/2 px-6 py-3 rounded-lg shadow-lg text-white font-medium z-50 view-hidden transition-all">
        <div class="flex items-center gap-2">
            <span id="notifIcon"></span>
            <span id="notifMessage">Pesan Notifikasi</span>
        </div>
    </div>

    <!-- Kontainer Utama Card -->
    <div class="bg-white w-full max-w-md rounded-2xl shadow-2xl p-8 relative overflow-hidden animate-slide-up border border-gray-100">
        
        <!-- Ornamen Dekoratif di pojok -->
        <div class="absolute -top-10 -right-10 w-32 h-32 bg-primaryLight opacity-20 rounded-full blur-2xl"></div>
        <div class="absolute -bottom-10 -left-10 w-32 h-32 bg-primary opacity-20 rounded-full blur-2xl"></div>

        <!-- Header & Logo -->
        <div class="text-center mb-8 relative z-10">
            <div class="inline-flex items-center justify-center w-14 h-14 bg-green-50 rounded-full text-primary mb-3 shadow-inner">
                <!-- Ikon Tas Belanja (SVG) -->
                <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z" />
                </svg>
            </div>
            <h1 class="text-2xl font-bold text-gray-800 tracking-tight">BELANJA<span class="text-primary">DULU</span></h1>
            <p class="text-sm text-gray-500 mt-1" id="subtitleText">Silakan masuk ke akun Anda</p>
        </div>

        <!-- VIEW: LOGIN -->
        <div id="loginView" class="relative z-10 animate-fade-in">
            <form id="loginForm" novalidate>
                <!-- Input NISN / NIK -->
                <div class="mb-5">
                    <label for="nikInput" class="block text-sm font-semibold text-gray-700 mb-1">NISN / NIK</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-gray-400">
                            <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V8a2 2 0 00-2-2h-5m-4 0V5a2 2 0 114 0v1m-4 0a2 2 0 104 0m-5 8a2 2 0 100-4 2 2 0 000 4zm0 0c1.306 0 2.417.835 2.83 2M9 14a3.001 3.001 0 00-2.83 2M15 11h3m-3 4h2" />
                            </svg>
                        </div>
                        <input type="text" id="nikInput" required placeholder="Masukkan NISN atau NIK" 
                               class="w-full pl-10 pr-4 py-2.5 bg-gray-50 border border-gray-300 rounded-lg focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all text-gray-700">
                    </div>
                    <p class="text-xs text-error mt-1 hidden" id="nikError">NISN / NIK wajib diisi.</p>
                </div>

                <!-- Input Password -->
                <div class="mb-5">
                    <label for="passwordInput" class="block text-sm font-semibold text-gray-700 mb-1">Password</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-gray-400">
                            <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                            </svg>
                        </div>
                        <input type="password" id="passwordInput" required placeholder="Masukkan password" 
                               class="w-full pl-10 pr-12 py-2.5 bg-gray-50 border border-gray-300 rounded-lg focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all text-gray-700">
                        <!-- Toggle Password -->
                        <button type="button" id="togglePassword" class="absolute inset-y-0 right-0 pr-3 flex items-center text-gray-400 hover:text-primary transition-colors focus:outline-none">
                            <svg id="eyeIcon" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                            </svg>
                        </button>
                    </div>
                    <p class="text-xs text-error mt-1 hidden" id="passwordError">Password wajib diisi.</p>
                </div>

                <!-- Kode CAPTCHA -->
                <div class="mb-6">
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Verifikasi Keamanan</label>
                    <div class="flex items-center gap-3 mb-2">
                        <!-- Canvas untuk menggambar CAPTCHA secara dinamis -->
                        <div class="bg-gray-100 p-1 border border-gray-300 rounded-lg flex-1 text-center relative overflow-hidden">
                            <canvas id="captchaCanvas" width="120" height="40" class="mx-auto"></canvas>
                        </div>
                        <button type="button" id="refreshCaptchaBtn" class="p-2.5 bg-gray-100 hover:bg-gray-200 text-gray-600 rounded-lg border border-gray-300 transition-colors focus:outline-none" title="Refresh CAPTCHA">
                            <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                            </svg>
                        </button>
                    </div>
                    <input type="text" id="captchaInput" required placeholder="Masukkan kode CAPTCHA di atas" 
                           class="w-full px-4 py-2.5 bg-gray-50 border border-gray-300 rounded-lg focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all text-gray-700 uppercase" autocomplete="off">
                    <p class="text-xs text-error mt-1 hidden" id="captchaError">CAPTCHA tidak sesuai.</p>
                </div>

                <!-- Lupa Password Link -->
                <div class="flex justify-end mb-6">
                    <button type="button" onclick="switchView('forgot')" class="text-sm text-primary hover:text-primaryDark font-medium transition-colors">
                        Lupa Password?
                    </button>
                </div>

                <!-- Tombol Masuk -->
                <button type="submit" class="w-full bg-primary hover:bg-primaryDark text-white font-semibold py-3 px-4 rounded-lg shadow-md hover:shadow-lg transition-all duration-300 transform hover:-translate-y-0.5 flex items-center justify-center gap-2">
                    <span>MASUK</span>
                    <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3" />
                    </svg>
                </button>
            </form>

            <!-- Link Daftar -->
            <div class="mt-6 text-center text-sm text-gray-600">
                Belum punya akun? 
                <button type="button" onclick="switchView('register')" class="text-primary hover:text-primaryDark font-semibold transition-colors">
                    Daftar
                </button>
            </div>
        </div>

        <!-- VIEW: DAFTAR (Mockup) -->
        <div id="registerView" class="view-hidden relative z-10 animate-fade-in">
            <form id="registerForm" onsubmit="event.preventDefault(); showMessage('Fitur pendaftaran sedang dalam pengembangan.', 'success'); switchView('login');">
                <div class="mb-4">
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Nama Lengkap</label>
                    <input type="text" required placeholder="Nama sesuai KTP" class="w-full px-4 py-2.5 bg-gray-50 border border-gray-300 rounded-lg focus:outline-none focus:border-primary">
                </div>
                <div class="mb-4">
                    <label class="block text-sm font-semibold text-gray-700 mb-1">NISN / NIK</label>
                    <input type="text" required placeholder="Nomor Induk" class="w-full px-4 py-2.5 bg-gray-50 border border-gray-300 rounded-lg focus:outline-none focus:border-primary">
                </div>
                <div class="mb-6">
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Password Baru</label>
                    <input type="password" required placeholder="Buat password" class="w-full px-4 py-2.5 bg-gray-50 border border-gray-300 rounded-lg focus:outline-none focus:border-primary">
                </div>
                <button type="submit" class="w-full bg-primary hover:bg-primaryDark text-white font-semibold py-3 px-4 rounded-lg shadow-md transition-all">
                    BUAT AKUN
                </button>
            </form>
            <div class="mt-6 text-center text-sm">
                <button type="button" onclick="switchView('login')" class="text-gray-500 hover:text-gray-800 font-medium transition-colors flex items-center justify-center w-full gap-1">
                    <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" /></svg>
                    Kembali ke Login
                </button>
            </div>
        </div>

        <!-- VIEW: LUPA PASSWORD (Mockup) -->
        <div id="forgotView" class="view-hidden relative z-10 animate-fade-in">
            <p class="text-sm text-gray-600 mb-6 text-center">Masukkan NISN / NIK Anda. Kami akan memandu langkah pemulihan sandi selanjutnya.</p>
            <form id="forgotForm" onsubmit="event.preventDefault(); showMessage('Instruksi pemulihan telah dikirim (Simulasi).', 'success'); switchView('login');">
                <div class="mb-6">
                    <label class="block text-sm font-semibold text-gray-700 mb-1">NISN / NIK</label>
                    <input type="text" required placeholder="Masukkan NISN / NIK Anda" class="w-full px-4 py-2.5 bg-gray-50 border border-gray-300 rounded-lg focus:outline-none focus:border-primary">
                </div>
                <button type="submit" class="w-full bg-primary hover:bg-primaryDark text-white font-semibold py-3 px-4 rounded-lg shadow-md transition-all">
                    PULIHKAN PASSWORD
                </button>
            </form>
            <div class="mt-6 text-center text-sm">
                <button type="button" onclick="switchView('login')" class="text-gray-500 hover:text-gray-800 font-medium transition-colors flex items-center justify-center w-full gap-1">
                    <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" /></svg>
                    Kembali ke Login
                </button>
            </div>
        </div>

    </div>

    <script>
        // === STATE & REFERENSI DOM ===
        let currentCaptchaText = "";
        let notifTimeout;

        // Elemen DOM
        const loginForm = document.getElementById('loginForm');
        const nikInput = document.getElementById('nikInput');
        const passwordInput = document.getElementById('passwordInput');
        const captchaInput = document.getElementById('captchaInput');
        const togglePasswordBtn = document.getElementById('togglePassword');
        const eyeIcon = document.getElementById('eyeIcon');
        const refreshCaptchaBtn = document.getElementById('refreshCaptchaBtn');
        const canvas = document.getElementById('captchaCanvas');
        const ctx = canvas.getContext('2d');
        const subtitleText = document.getElementById('subtitleText');

        // Elemen View
        const loginView = document.getElementById('loginView');
        const registerView = document.getElementById('registerView');
        const forgotView = document.getElementById('forgotView');

        // === FUNGSI NAVIGASI VIEW ===
        function switchView(viewName) {
            // Sembunyikan semua
            loginView.classList.add('view-hidden');
            registerView.classList.add('view-hidden');
            forgotView.classList.add('view-hidden');
            
            // Reset input (opsional, agar form bersih saat ganti view)
            loginForm.reset();
            resetErrors();
            generateCaptcha();

            // Tampilkan yang dipilih
            if (viewName === 'login') {
                loginView.classList.remove('view-hidden');
                subtitleText.innerText = "Silakan masuk ke akun Anda";
            } else if (viewName === 'register') {
                registerView.classList.remove('view-hidden');
                subtitleText.innerText = "Buat akun baru BelanjaDulu";
            } else if (viewName === 'forgot') {
                forgotView.classList.remove('view-hidden');
                subtitleText.innerText = "Pemulihan Password";
            }
        }

        // === FUNGSI NOTIFIKASI KUSTOM ===
        function showMessage(message, type) {
            const notifBox = document.getElementById('notificationBox');
            const notifMessage = document.getElementById('notifMessage');
            const notifIcon = document.getElementById('notifIcon');
            
            // Hapus class warna sebelumnya
            notifBox.classList.remove('bg-primaryDark', 'bg-error', 'animate-slide-down');
            
            if (type === 'success') {
                notifBox.classList.add('bg-primaryDark');
                notifIcon.innerHTML = `<svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" /></svg>`;
            } else {
                notifBox.classList.add('bg-error');
                notifIcon.innerHTML = `<svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>`;
            }

            notifMessage.innerText = message;
            
            // Tampilkan animasi
            notifBox.classList.remove('view-hidden');
            // Memicu reflow agar animasi dapat diulang
            void notifBox.offsetWidth; 
            notifBox.classList.add('animate-slide-down');

            // Auto hide setelah 3.5 detik
            clearTimeout(notifTimeout);
            notifTimeout = setTimeout(() => {
                notifBox.classList.add('view-hidden');
            }, 3500);
        }

        // === TOGGLE PASSWORD ===
        togglePasswordBtn.addEventListener('click', function() {
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                // Ikon Mata Terbuka (Melihat)
                eyeIcon.innerHTML = `
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21" />
                `;
            } else {
                passwordInput.type = 'password';
                // Ikon Mata Tertutup (Hidden)
                eyeIcon.innerHTML = `
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                `;
            }
        });

        // === GENERATOR CAPTCHA ===
        function generateCaptcha() {
            // Karakter yang digunakan (menghindari O, 0, I, 1 agar tidak membingungkan)
            const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
            currentCaptchaText = '';
            for (let i = 0; i < 5; i++) {
                currentCaptchaText += chars.charAt(Math.floor(Math.random() * chars.length));
            }

            // Membersihkan canvas
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Latar belakang dengan sedikit noise
            ctx.fillStyle = '#f3f4f6';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Tambahkan garis acak (Noise)
            for (let i = 0; i < 5; i++) {
                ctx.beginPath();
                ctx.moveTo(Math.random() * canvas.width, Math.random() * canvas.height);
                ctx.lineTo(Math.random() * canvas.width, Math.random() * canvas.height);
                ctx.strokeStyle = `rgba(16, 185, 129, ${Math.random() * 0.5})`; // Warna hijau transparan
                ctx.lineWidth = Math.random() * 2;
                ctx.stroke();
            }

            // Menggambar teks CAPTCHA dengan efek rotasi sedikit
            ctx.font = 'bold 22px Poppins, sans-serif';
            ctx.textBaseline = 'middle';
            
            for (let i = 0; i < currentCaptchaText.length; i++) {
                ctx.save();
                const x = 15 + (i * 20);
                const y = canvas.height / 2 + (Math.random() * 4 - 2); // Naik turun sedikit
                const rot = (Math.random() - 0.5) * 0.4; // Rotasi acak
                
                ctx.translate(x, y);
                ctx.rotate(rot);
                ctx.fillStyle = '#047857'; // Warna teks hijau tua
                ctx.fillText(currentCaptchaText[i], 0, 0);
                ctx.restore();
            }
            
            // Kosongkan input setiap kali refresh
            captchaInput.value = '';
        }

        // Listener Tombol Refresh CAPTCHA
        refreshCaptchaBtn.addEventListener('click', generateCaptcha);

        // === VALIDASI & ERROR HANDLING ===
        function showError(inputId, errorId, message) {
            const inputEl = document.getElementById(inputId);
            const errorEl = document.getElementById(errorId);
            inputEl.classList.add('input-error');
            errorEl.innerText = message;
            errorEl.classList.remove('hidden');
        }

        function resetErrors() {
            const inputs = ['nikInput', 'passwordInput', 'captchaInput'];
            const errors = ['nikError', 'passwordError', 'captchaError'];
            
            inputs.forEach(id => {
                document.getElementById(id).classList.remove('input-error');
            });
            errors.forEach(id => {
                document.getElementById(id).classList.add('hidden');
            });
        }

        // Event Submit Login
        loginForm.addEventListener('submit', function(e) {
            e.preventDefault();
            resetErrors();
            
            let isValid = true;
            
            // Ambil value
            const nik = nikInput.value.trim();
            const password = passwordInput.value;
            const captcha = captchaInput.value.trim().toUpperCase();

            // Validasi NIK
            if (!nik) {
                showError('nikInput', 'nikError', 'NISN / NIK tidak boleh kosong.');
                isValid = false;
            } else if (nik.length < 5) {
                showError('nikInput', 'nikError', 'NISN / NIK tidak valid.');
                isValid = false;
            }

            // Validasi Password
            if (!password) {
                showError('passwordInput', 'passwordError', 'Password tidak boleh kosong.');
                isValid = false;
            }

            // Validasi CAPTCHA
            if (!captcha) {
                showError('captchaInput', 'captchaError', 'Masukkan kode CAPTCHA.');
                isValid = false;
            } else if (captcha !== currentCaptchaText) {
                showError('captchaInput', 'captchaError', 'Kode CAPTCHA salah, coba lagi.');
                isValid = false;
                generateCaptcha(); // Buat baru jika salah
            }

            // Jika semua valid
            if (isValid) {
                // Tampilkan notifikasi sukses (simulasi proses login)
                showMessage('Login berhasil! Mengalihkan halaman...', 'success');
                
                // Menonaktifkan tombol sementara
                const btn = loginForm.querySelector('button[type="submit"]');
                const originalText = btn.innerHTML;
                btn.innerHTML = `<svg class="animate-spin h-5 w-5 mr-2 inline" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> Memproses...`;
                btn.disabled = true;

                // Simulasi redirect
                setTimeout(() => {
                    btn.innerHTML = originalText;
                    btn.disabled = false;
                    // window.location.href = '/dashboard'; // Diaktifkan pada implementasi nyata
                }, 2000);
            } else {
                showMessage('Harap periksa kembali isian Anda.', 'error');
            }
        });

        // === INITIALIZATION ===
        window.onload = function() {
            generateCaptcha();
        };

    </script>
</body>
</html>
