<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Login - BELANJADULU</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #00a86b, #006b45);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .login-box {
      width: 380px;
      background: white;
      padding: 35px;
      border-radius: 18px;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.2);
    }

    .logo {
      text-align: center;
      font-size: 30px;
      font-weight: bold;
      color: #00a86b;
      margin-bottom: 8px;
    }

    .logo span {
      color: #8bc900;
    }

    .subtitle {
      text-align: center;
      color: #777;
      font-size: 14px;
      margin-bottom: 25px;
    }

    .input-group {
      margin-bottom: 17px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-size: 13px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #ddd;
      border-radius: 8px;
      outline: none;
      font-size: 14px;
    }

    input:focus {
      border-color: #00a86b;
      box-shadow: 0 0 0 2px rgba(0, 168, 107, 0.1);
    }

    .login-btn {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 8px;
      background: #00a86b;
      color: white;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 5px;
    }

    .login-btn:hover {
      background: #008f5b;
    }

    .register {
      text-align: center;
      margin-top: 20px;
      font-size: 13px;
      color: #777;
    }

    .register a {
      color: #00a86b;
      font-weight: bold;
      text-decoration: none;
    }

    .error {
      display: none;
      color: #e53935;
      background: #ffebee;
      padding: 10px;
      border-radius: 7px;
      text-align: center;
      font-size: 13px;
      margin-bottom: 15px;
    }
  </style>
</head>

<body>

  <div class="login-box">

    <div class="logo">
      BELANJA<span>DULU</span>
    </div>

    <div class="subtitle">
      Selamat datang kembali 👋
    </div>

    <div class="error" id="error">
      Username atau password salah!
    </div>

    <form id="loginForm">

      <div class="input-group">
        <label>Username / Email</label>

        <input
          type="text"
          id="username"
          placeholder="Masukkan username atau email"
          required
        >
      </div>

      <div class="input-group">
        <label>Password</label>

        <input
          type="password"
          id="password"
          placeholder="Masukkan password"
          required
        >
      </div>

      <button
        type="submit"
        class="login-btn"
      >
        MASUK
      </button>

    </form>

    <div class="register">
      Belum punya akun?
      <a href="#">Daftar sekarang</a>
    </div>

  </div>


  <!-- JAVASCRIPT -->
  <script>

    document
      .getElementById("loginForm")
      .addEventListener("submit", function(event) {

        event.preventDefault();

        const username =
          document.getElementById("username").value;

        const password =
          document.getElementById("password").value;


        // AKUN DEMO
        if (
          username === "admin" &&
          password === "12345"
        ) {

          // Simpan status login
          localStorage.setItem(
            "belanjaduluLogin",
            "true"
          );

          localStorage.setItem(
            "belanjaduluUser",
            username
          );

          // PINDAH KE INDEX.HTML
          window.location.href = "index.html";

        } else {

          document.getElementById(
            "error"
          ).style.display = "block";

        }

      });<script>
  ...
  window.location.href = "index.html";
  ...
</script>

  </script>

</body>
</html>
